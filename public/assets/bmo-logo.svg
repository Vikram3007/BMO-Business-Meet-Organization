<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 130" width="100%" height="100%" fill="none">
  <!-- Original BMO Logo (Standard / Dark Text on Transparent Canvas) -->
  <!-- Rounded Rectangle in Official BMO Deep Blue -->
  <rect x="15" y="10" width="290" height="82" rx="12" fill="#0c1975" />
  
  <!-- BMO Bold Serif Typography -->
  <text x="160" y="73" text-anchor="middle" fill="#FFFFFF" font-family="'Times New Roman', 'Georgia', 'DejaVu Serif', serif" font-weight="900" font-size="64" letter-spacing="0.04em">BMO</text>
  
  <!-- The Ethics of Business (Italic Serif Tagline) -->
  <text x="160" y="118" text-anchor="middle" fill="#0c1975" font-family="'Times New Roman', 'Georgia', 'Baskerville', serif" font-style="italic" font-weight="600" font-size="24.5" letter-spacing="0.01em">The Ethics of Business</text>
</svg>
